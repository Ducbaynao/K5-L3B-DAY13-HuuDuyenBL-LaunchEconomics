# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (co_mau(0.70, 0.75), z chính xác).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 3.103 mỗi nhóm → 42 người/nhóm, tổng 84 > 40 nhân viên: không đủ người.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng tối đa c/ICC = 20/0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: n hiệu dụng tối đa 6/0,02 = 300; chỉ 6 cụm (< 20): loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (0,98 + 0,02m) ≥ 859 → m ≥ 299 yêu cầu mỗi người (DE = 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: rủi ro chia sẻ câu trả lời trong depot; quyền truy cập trợ lý theo tài khoản, log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện): chia theo nhân viên 20 + 20 để tách được tác động,
#   chấp nhận mức chênh phát hiện được 6 điểm thay vì 5 (cần ≥ 299 yêu cầu mỗi nhân viên). Nếu tác động thật chỉ 5 điểm,
#   power chỉ còn 0,64 với n = 859. Giám đốc vận hành ký chấp nhận trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: hiện tại 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97%. Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu nên không dùng. Dùng so với nhóm đối chứng (chênh +2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"                      # một người có tên vai trò, không ghi "cả đội"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×)"                      # loại yêu cầu nào, depot nào; dựa vào kết quả A3
  assignment:
    unit: "staff"                 # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm không đủ mẫu với 40 nhân viên
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96           # 1 nếu chia theo yêu cầu; m = 299 yêu cầu mỗi nhân viên
    clusters_per_arm: 20          # để trống nếu chia theo yêu cầu
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot; bốc thăm bằng code với seed ghi trước, phân tầng theo depot"
    spillover_risk: "Nhân viên đối chứng có thể chép câu trả lời của đồng nghiệp cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Chỉ số chính, mde 0,06, ba luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu 2026-12-07"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm hoặc vượt 6%, hoặc có ít nhất 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày làm việc KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"                   # ai bấm, mất bao lâu, khách được phục vụ bằng gì
  decision_date: "2027-01-11"     # bắt đầu 2026-12-07; bước 0.50 từ 2026-12-21, cần ~2 tuần để đạt 299 yêu cầu/người cộng 7 ngày theo dõi mở lại
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "12.000 đ nhân viên tự làm (6 phút × 2.000 đ)", "chi phí cố định 40 triệu đ/tháng", "ngưỡng chi phí 8.000 đ/việc suy ra từ 3.414 đ và 4.599 đ"]         # liệt kê mọi con số giả lập đã dùng
